# Code Laundry bundled Semgrep rules for TypeScript/JavaScript.
# metadata.laundry_severity maps to Code Laundry severities (critical/high/medium/low).
rules:
  # ---------- injection (taint: request data -> dangerous sink) ----------
  - id: sql-injection
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      User-controlled data flows into a SQL query string. Use parameterized queries
      (placeholders such as $1 or ?, plus a values array) instead of string building.
    metadata: { laundry_severity: critical, cwe: "CWE-89" }
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.query
          - pattern: $REQ.params
          - pattern: $REQ.body
          - pattern: $REQ.headers
          - pattern: $REQ.cookies
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB.query($Q, ...)
              - pattern: $DB.execute($Q, ...)
              - pattern: $DB.raw($Q, ...)
              - pattern: $DB.$queryRawUnsafe($Q, ...)
              - pattern: $DB.$executeRawUnsafe($Q, ...)
              - pattern: $DB.prepare($Q, ...)
              - pattern: $DB.exec($Q, ...)
              - pattern: $DB.all($Q, ...)
              - pattern: $DB.get($Q, ...)
              - pattern: $DB.run($Q, ...)
          - focus-metavariable: $Q
    pattern-sanitizers:
      - pattern: parseInt(...)
      - pattern: Number(...)

  - id: sql-injection-string-built
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      SQL query built with string interpolation or concatenation. Use parameterized
      queries instead (placeholders plus a values array).
    metadata: { laundry_severity: high, cwe: "CWE-89" }
    patterns:
      - pattern-either:
          - pattern: $DB.$METHOD(`$SQL${$X}...`, ...)
          - pattern: $DB.$METHOD(<... "$SQL" + $X ...>, ...)
          - pattern: |
              $Q = `$SQL${$X}...`;
              ...
              $DB.$METHOD($Q, ...);
          - pattern: |
              $Q = <... "$SQL" + $X ...>;
              ...
              $DB.$METHOD($Q, ...);
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(query|execute|raw|exec|prepare|all|get|run|\$queryRawUnsafe|\$executeRawUnsafe)$
      - metavariable-regex:
          metavariable: $SQL
          regex: (?i)^\s*(select|insert|update|delete|with|replace|merge)\b

  - id: command-injection
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Shell command built from dynamic input. Use execFile/spawn with an argument array
      (no shell) and validate the input against an allow-list.
    metadata: { laundry_severity: critical, cwe: "CWE-78" }
    patterns:
      - pattern-either:
          - pattern: $CP.exec(`...${...}...`, ...)
          - pattern: $CP.execSync(`...${...}...`, ...)
          - pattern: $CP.exec("..." + $X, ...)
          - pattern: $CP.execSync("..." + $X, ...)
          - pattern: exec(`...${...}...`, ...)
          - pattern: execSync(`...${...}...`, ...)
          - pattern: exec("..." + $X, ...)
          - pattern: execSync("..." + $X, ...)
          - pattern: '$CP.spawn($CMD, $ARGS, {..., shell: true, ...})'
          - pattern: 'spawn($CMD, $ARGS, {..., shell: true, ...})'

  - id: path-traversal
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Request data is used in a file path. An attacker can use ../ to read or write
      files outside the intended directory. Resolve the path and check it stays inside
      the base directory (path.resolve + startsWith), or use path.basename.
    metadata: { laundry_severity: high, cwe: "CWE-22" }
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.query
          - pattern: $REQ.params
          - pattern: $REQ.body
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $FS.readFile($P, ...)
              - pattern: $FS.readFileSync($P, ...)
              - pattern: $FS.writeFile($P, ...)
              - pattern: $FS.writeFileSync($P, ...)
              - pattern: $FS.createReadStream($P, ...)
              - pattern: $FS.createWriteStream($P, ...)
              - pattern: $FS.unlink($P, ...)
              - pattern: $FS.rm($P, ...)
              - pattern: readFile($P, ...)
              - pattern: readFileSync($P, ...)
              - pattern: writeFile($P, ...)
              - pattern: createReadStream($P, ...)
              - pattern: $RES.sendFile($P, ...)
              - pattern: $RES.download($P, ...)
          - focus-metavariable: $P
    pattern-sanitizers:
      - pattern: path.basename(...)
      - pattern: basename(...)

  - id: ssrf
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      Request data controls the URL of an outbound request (SSRF). An attacker can reach
      internal services or cloud metadata endpoints. Validate the host against an
      allow-list before fetching.
    metadata: { laundry_severity: high, cwe: "CWE-918" }
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.query
          - pattern: $REQ.params
          - pattern: $REQ.body
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fetch($U, ...)
              - pattern: axios($U, ...)
              - pattern: axios.get($U, ...)
              - pattern: axios.post($U, ...)
              - pattern: axios.request($U)
              - pattern: got($U, ...)
              - pattern: $HTTP.get($U, ...)
              - pattern: $HTTP.request($U, ...)
          - focus-metavariable: $U

  - id: open-redirect
    mode: taint
    languages: [typescript, javascript]
    severity: WARNING
    message: Redirect target comes from request data (open redirect). Only redirect to known paths or allow-listed hosts.
    metadata: { laundry_severity: medium, cwe: "CWE-601" }
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.query
          - pattern: $REQ.params
          - pattern: $REQ.body
    pattern-sinks:
      - patterns:
          - pattern: $RES.redirect($U)
          - focus-metavariable: $U

  - id: xss-reflected
    mode: taint
    languages: [typescript, javascript]
    severity: ERROR
    message: Request data is written into an HTML response without escaping (XSS). Escape it or use a template engine that auto-escapes.
    metadata: { laundry_severity: high, cwe: "CWE-79" }
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.query
          - pattern: $REQ.params
          - pattern: $REQ.body
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RES.send(`...${$X}...`)
              - pattern: $RES.write(`...${$X}...`)
              - pattern: $RES.send("..." + $X + "...")
          - focus-metavariable: $X

  - id: dom-xss
    languages: [typescript, javascript]
    severity: WARNING
    message: Assigning dynamic content to innerHTML/outerHTML or dangerouslySetInnerHTML allows script injection. Use textContent or sanitize with a vetted library.
    metadata: { laundry_severity: medium, cwe: "CWE-79" }
    pattern-either:
      - patterns:
          - pattern: $EL.innerHTML = $X
          - pattern-not: $EL.innerHTML = "..."
      - patterns:
          - pattern: $EL.outerHTML = $X
          - pattern-not: $EL.outerHTML = "..."
      - pattern: "<$T dangerouslySetInnerHTML={...} />"
      - pattern: "<$T dangerouslySetInnerHTML={...}>...</$T>"

  # ---------- unsafe eval beyond what ESLint covers ----------
  - id: vm-code-execution
    languages: [typescript, javascript]
    severity: ERROR
    message: vm.run* executes strings as code and is not a security sandbox. Do not run untrusted input.
    metadata: { laundry_severity: critical, cwe: "CWE-95" }
    pattern-either:
      - pattern: $VM.runInNewContext(...)
      - pattern: $VM.runInThisContext(...)
      - pattern: $VM.runInContext(...)
      - pattern: new $VM.Script(...)

  # ---------- insecure crypto ----------
  - id: weak-hash
    languages: [typescript, javascript]
    severity: WARNING
    message: MD5 and SHA-1 are broken for security purposes. Use SHA-256 or better; for passwords use bcrypt, scrypt or argon2.
    metadata: { laundry_severity: medium, cwe: "CWE-328" }
    patterns:
      - pattern-either:
          - pattern: $C.createHash("$ALG")
          - pattern: createHash("$ALG")
      - metavariable-regex:
          metavariable: $ALG
          regex: (?i)^(md4|md5|sha1|sha-1|ripemd160)$

  - id: password-fast-hash
    languages: [typescript, javascript]
    severity: ERROR
    message: Passwords hashed with a fast general-purpose hash can be brute-forced. Use bcrypt, scrypt or argon2.
    metadata: { laundry_severity: high, cwe: "CWE-916" }
    patterns:
      - pattern-either:
          - pattern: $C.createHash($ALG).update($PW)
          - pattern: createHash($ALG).update($PW)
      - metavariable-regex:
          metavariable: $PW
          regex: (?i).*(password|passwd|pwd).*

  - id: weak-cipher
    languages: [typescript, javascript]
    severity: ERROR
    message: Weak or deprecated cipher. Use AES-256-GCM via crypto.createCipheriv with a random IV.
    metadata: { laundry_severity: high, cwe: "CWE-327" }
    pattern-either:
      - pattern: $C.createCipher(...)
      - pattern: $C.createDecipher(...)
      - patterns:
          - pattern-either:
              - pattern: $C.createCipheriv("$ALG", ...)
              - pattern: createCipheriv("$ALG", ...)
          - metavariable-regex:
              metavariable: $ALG
              regex: (?i).*(des|rc4|rc2|blowfish|bf-|ecb).*

  - id: insecure-randomness
    languages: [typescript, javascript]
    severity: WARNING
    message: Math.random() is predictable. Use crypto.randomBytes/randomUUID/getRandomValues for tokens, secrets and IDs.
    metadata: { laundry_severity: high, cwe: "CWE-338" }
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $V = <... Math.random() ...>
              - pattern: const $V = <... Math.random() ...>;
              - pattern: let $V = <... Math.random() ...>;
          - metavariable-regex:
              metavariable: $V
              regex: (?i).*(token|secret|password|passwd|salt|nonce|session|apikey|api_key|otp|csrf).*
      - patterns:
          - pattern-inside: |
              function $F(...) { ... }
          - pattern: Math.random()
          - metavariable-regex:
              metavariable: $F
              regex: (?i).*(token|secret|password|passwd|salt|nonce|session|apikey|otp|csrf).*

  - id: tls-verification-disabled
    languages: [typescript, javascript]
    severity: ERROR
    message: TLS certificate verification is disabled, so connections can be intercepted. Remove this and fix the certificate setup instead.
    metadata: { laundry_severity: high, cwe: "CWE-295" }
    pattern-either:
      - pattern: "{..., rejectUnauthorized: false, ...}"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
      - pattern: process.env["NODE_TLS_REJECT_UNAUTHORIZED"] = "0"

  - id: jwt-none-or-unverified
    languages: [typescript, javascript]
    severity: ERROR
    message: JWT accepted without signature verification. Use jwt.verify with an explicit algorithms list; never allow "none".
    metadata: { laundry_severity: critical, cwe: "CWE-347" }
    pattern-either:
      - pattern: '$JWT.verify($T, $K, {..., algorithms: [..., "none", ...], ...})'
      - pattern: '$JWT.verify($T, $K, {..., algorithms: ["none"], ...}, ...)'

  - id: cors-wildcard-with-credentials
    languages: [typescript, javascript]
    severity: WARNING
    message: CORS allows any origin together with credentials. Restrict origin to an allow-list.
    metadata: { laundry_severity: medium, cwe: "CWE-942" }
    pattern-either:
      - pattern: 'cors({..., origin: "*", credentials: true, ...})'
      - pattern: "cors({..., origin: true, credentials: true, ...})"
